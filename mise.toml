[tools]
go = "1.26.3"
"github:lucasew/workspaced" = "0.5.3"

[tasks]

[tasks.install]
depends = ["install:*"]

[tasks."install:go"]
run = "go mod download"

[tasks.codegen]
depends = ["codegen:*"]

[tasks.test]
depends = ["test:*"]

[tasks."test:go"]
run = "go test ./..."

[tasks.lint]
run = "workspaced codebase lint"

[tasks.fmt]
run = "workspaced codebase format"

[tasks.ci]
depends = ["lint", "test"]
