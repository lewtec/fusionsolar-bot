# This is a basic workflow to help you get started with Actions

name: Send a bump PR and test eval

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  workflow_dispatch:

concurrency:
  group: prebuild
  cancel-in-progress: true

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    name: "bump from commit ${{ github.sha }}"
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Get ingredients
        uses: actions/checkout@v2
      - name: Install the stove
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            build-dir = /nix/build
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Bump
        run: nix flake update
      - name: "nix flake check"
        run: nix flake check
      - uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: /nix/var/log/nix/drvs
          include-hidden-files: true
      - name: Serve
        uses: peter-evans/create-pull-request@v4
        with:
          title: "The flake bump is ready"
          body: |
            I updated your flake and built all the stuff to the binary cache.
          branch: bump-and-cook
          commit-message: bump
          author: "A helpful machine <actions@github.com>"
          committer: "A helpful machine <actions@github.com>"
          delete-branch: true
          reviewers: |
            lucasew

